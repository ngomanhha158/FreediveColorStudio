name: Patch and Build
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- B1: neu co patch.zip o goc repo thi giai nen de len ma nguon ---
      - name: Apply patch.zip
        run: |
          set -e
          if [ -f patch.zip ]; then
            echo "Tim thay patch.zip — dang giai nen"
            unzip -o patch.zip -d .
            rm -f patch.zip
            git config user.name "patch-bot"
            git config user.email "patch-bot@users.noreply.github.com"
            git add -A
            git commit -m "Ap dung patch.zip" || echo "khong co thay doi"
            git push
          else
            echo "Khong co patch.zip — build ma nguon hien tai"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install SDK components
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "cmake;3.22.1" "platforms;android-36" "build-tools;36.0.0" > /dev/null || true

      - name: Build debug APK
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Trim log
        if: always()
        run: tail -c 200000 build.log > build-tail.log || echo "no log" > build-tail.log

      - name: Publish build log
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-log
          name: "Build log (auto)"
          prerelease: true
          files: build-tail.log

      - name: Fail if build failed
        if: steps.build.outcome != 'success'
        run: exit 1

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk FreediveColorStudio-v1.1-dev-debug.apk

      - name: Publish release (tag apk-latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: "APK build (auto)"
          prerelease: true
          files: FreediveColorStudio-v1.1-dev-debug.apk
