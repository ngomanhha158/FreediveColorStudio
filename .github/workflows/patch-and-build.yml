name: Patch and Build
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write        # chi de tao Release chua APK + log

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ----------------------------------------------------------------------
      # Giai nen moi file .zip o goc repo DE LEN ma nguon, roi build ngay.
      # KHONG commit, KHONG push: token cua workflow thuong chi co quyen doc,
      # va moi lan "git push" that bai la ca job chet truoc khi kip build.
      # Zip cu nam lai trong repo cung khong sao — moi lan chay lai deu ap lai.
      # Thu tu ap: theo ten file (a -> z), nen zip moi hon nen dat ten sau.
      # ----------------------------------------------------------------------
      - name: Apply zip patches
        run: |
          set -e
          shopt -s nullglob
          zips=(*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "Khong co file .zip nao — build ma nguon hien tai"
          else
            for z in $(printf '%s\n' "${zips[@]}" | sort); do
              echo "==> Giai nen $z"
              unzip -o "$z" -d .
            done
            echo "--- Da ap xong, danh sach file nguon: ---"
            find app/src/main/java -name '*.kt' | sort
          fi

      # ----------------------------------------------------------------------
      # Kiem tra shader GLSL. Gradle KHONG the bat loi shader: GLSL chi duoc
      # bien dich luc chay, tren GPU cua may that. Build xanh van co the ra mot
      # app man hinh den. glslangValidator bien dich offline nen bat duoc ngay.
      # ----------------------------------------------------------------------
      - name: Validate GLSL shaders
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y glslang-tools -qq
          fail=0
          for f in app/src/main/assets/shaders/gl/*.glsl; do
            case "$f" in *vertex*) st=vert ;; *) st=frag ;; esac
            if glslangValidator -S $st "$f" > /tmp/glsl.txt 2>&1; then
              echo "OK   $f"
            else
              echo "LOI  $f"; cat /tmp/glsl.txt; fail=1
            fi
          done
          exit $fail

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install SDK components
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "cmake;3.22.1" "platforms;android-36" "build-tools;36.0.0" > /dev/null || true

      - name: Build debug APK
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Trim log
        if: always()
        run: tail -c 200000 build.log > build-tail.log || echo "khong co build.log" > build-tail.log

      - name: Publish build log
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-log
          name: "Build log (auto)"
          prerelease: true
          files: build-tail.log

      - name: Fail if build failed
        if: steps.build.outcome != 'success'
        run: exit 1

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk FreediveColorStudio-v1.1-dev-debug.apk

      - name: Publish release (tag apk-latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: "APK build (auto)"
          prerelease: true
          files: FreediveColorStudio-v1.1-dev-debug.apk
